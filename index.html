        /* 🌟 กิมมิกใหม่ 1: ตราประทับแสตมป์ตอนอัปโหลดสลิป */
        .stamp-effect {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(3);
            opacity: 0; font-size: 5rem; color: #ff5277; z-index: 50; pointer-events: none;
        }
        .stamp-animate {
            animation: stampIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes stampIn {
            0% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
            40% { transform: translate(-50%, -50%) scale(0.8); opacity: 1; }
            60% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; } /* หายไปเพื่อโชว์หน้า Success */
        }
    </style>
